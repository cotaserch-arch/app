<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bot · Clutch</title>
  <meta name="theme-color" content="#05080f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <div id="loading" class="empty"><span class="spinner"></span></div>
    <div id="missing" class="empty hidden"><h2>Bot not found</h2><p><a href="/bots">Back to the bot league →</a></p></div>
    <div id="page" class="hidden">
      <div id="banner" style="margin-top:20px"></div>
      <div class="row" style="padding:24px 0 16px;align-items:flex-end">
        <div>
          <div class="row start" style="gap:8px" id="tags"></div>
          <h1 id="name" style="font-size:clamp(2rem,5vw,3rem);margin:10px 0 4px;font-style:italic"></h1>
          <div class="muted" id="byline"></div>
        </div>
        <div style="text-align:right"><div class="muted small">Live profit</div><div class="num" style="font-size:2.6rem;font-weight:900" id="profit"></div></div>
      </div>
      <div class="row start" style="gap:8px;margin-bottom:18px">
        <button class="btn" id="hype-btn">🔥 Hype</button>
        <a class="btn ghost" id="clone-btn">🧬 Clone</a>
        <button class="btn ghost" id="share-btn">🔗 Share</button>
      </div>
      <div class="layout">
        <div class="stack">
          <div class="card">
            <div class="section-head" style="margin-bottom:8px"><h3 style="margin:0">Live in the league</h3><span class="badge" id="since"></span></div>
            <div class="grid cols-4" id="live-stats" style="margin-bottom:14px"></div>
            <div id="live-chart"></div>
          </div>
          <div class="card">
            <h3>Recent bets</h3>
            <div class="table-wrap"><table class="board" id="bets"></table></div>
          </div>
          <div class="card">
            <div class="section-head" style="margin-bottom:8px"><h3 style="margin:0">Last 30 days, replayed</h3><span class="badge">Backtest</span></div>
            <div class="grid cols-4" id="bt-stats"></div>
          </div>
        </div>
        <aside class="stack">
          <div class="card"><h3>The rules 🔒</h3><ul id="rules" style="margin:0;padding-left:20px"></ul></div>
          <div class="card" id="prompt-card"><h3>The original idea</h3><p class="muted" id="prompt" style="font-style:italic;margin:0"></p></div>
          <div class="ad-slot" data-slot="bot"></div>
        </aside>
      </div>
    </div>
  </main>
  <script type="module">
    import { lineChart } from "/js/chart.js";
    import { $, api, config, escapeHtml, ml, rankLabel, renderShell, share, signed, toast } from "/js/common.js";
    import { describeRules } from "/js/rules.js";
    import { statTiles } from "/js/bot-stats.js";
    renderShell("bots");
    const id = decodeURIComponent(location.pathname.split("/")[2] || "");
    try {
      const [{ bot, live, backtest }, cfg] = await Promise.all([api(`/api/bots/${encodeURIComponent(id)}`), config()]);
      document.title = `${bot.name} by @${bot.creator} · Clutch`;
      if (new URLSearchParams(location.search).get("new") === "1") $("banner").innerHTML = `<div class="card glow">🏁 <b>${escapeHtml(bot.name)} is in the league!</b> It bets on every matching game from now on. Share it and check back.</div>`;
      $("tags").innerHTML = `<span class="badge brand">${bot.rank ? `${rankLabel(bot.rank)} Rank #${bot.rank}` : "Unranked"}</span>${bot.sample ? '<span class="badge">Sample</span>' : ""}`;
      $("name").textContent = bot.name;
      $("byline").textContent = `by @${bot.creator}`;
      $("profit").innerHTML = live.stats.profit === 0 ? "0" : `<span class="${live.stats.profit > 0 ? "up" : "down"}">${live.stats.profit > 0 ? "▲" : "▼"} ${signed(live.stats.profit)}</span>`;
      $("since").textContent = `Since ${bot.createdAt.slice(0, 10)}`;
      $("live-stats").innerHTML = statTiles(live.stats);
      lineChart($("live-chart"), { height: 240, baseline: 0, series: [{ name: "Profit (coins)", short: "Profit", points: live.curve, color: "var(--series-1)" }] });
      $("bt-stats").innerHTML = statTiles(backtest.stats);
      $("rules").innerHTML = describeRules(bot.rules, cfg.sports).map((i) => `<li>${escapeHtml(i)}</li>`).join("");
      if (bot.prompt) $("prompt").textContent = `“${bot.prompt}”`; else $("prompt-card").classList.add("hidden");
      $("bets").innerHTML = live.bets.length
        ? `<thead><tr><th>Game</th><th>Bet</th><th class="r">Result</th></tr></thead><tbody>${live.bets
            .map((b) => `<tr><td class="small">${cfg.sports[b.sport].emoji} ${escapeHtml(b.startsAt.slice(5, 10))}</td><td>${escapeHtml(b.team)} <span class="muted num small">${ml(b.ml)}</span></td><td class="r num ${b.won ? "up" : "down"}">${b.won ? "✅" : "❌"} ${signed(b.result)}</td></tr>`)
            .join("")}</tbody>`
        : '<tbody><tr><td class="muted">No bets settled yet. It bets on the next matching game.</td></tr></tbody>';
      const hypeBtn = $("hype-btn");
      hypeBtn.textContent = `🔥 ${bot.hype}`;
      hypeBtn.addEventListener("click", async () => {
        const r = await api(`/api/bots/${encodeURIComponent(id)}/hype`, { method: "POST", body: {} });
        hypeBtn.textContent = `🔥 ${r.hype}`;
        hypeBtn.disabled = true;
      });
      $("clone-btn").href = `/bots?idea=${encodeURIComponent(bot.prompt || bot.rules.summary)}`;
      $("share-btn").addEventListener("click", () => share({ title: "Clutch", text: `My betting bot ${bot.name} is ${signed(live.stats.profit)} coins on Clutch. Can yours beat it?`, url: `${location.origin}/bot/${encodeURIComponent(bot.id)}` }));
      $("loading").classList.add("hidden");
      $("page").classList.remove("hidden");
    } catch {
      $("loading").classList.add("hidden");
      $("missing").classList.remove("hidden");
    }
  </script>
</body>
</html>
