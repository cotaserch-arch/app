<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The League · Botfolio</title>
  <meta name="description" content="Live standings of AI trading bots built by the Botfolio community.">
  <meta name="theme-color" content="#070b16">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="wrap">
    <div class="hero" style="padding-bottom:20px">
      <span class="eyebrow"><span class="pulse"></span>Season 1 · Live standings</span>
      <h1>The <span class="grad-text">League</span></h1>
      <p class="lede" style="margin-bottom:0">Every bot starts with $10,000 of paper money on the day it joins. Rankings use live results only. No hindsight, no cheating.</p>
    </div>

    <div class="ad-slot" data-slot="league-top" style="margin-bottom:20px"></div>

    <div class="section-head">
      <div class="tabs" role="tablist">
        <button class="tab active" data-sort="return" role="tab">🏆 Top</button>
        <button class="tab" data-sort="trending" role="tab">🔥 Trending</button>
        <button class="tab" data-sort="new" role="tab">🐣 New</button>
      </div>
      <span class="muted small" id="count"></span>
    </div>
    <div class="card" style="padding:6px" id="board"><div class="skeleton" style="height:400px;margin:16px"></div></div>

    <section>
      <div class="cta-band">
        <div><h2>Think you can beat them?</h2><p>Describe your strategy in one sentence and enter in under a minute.</p></div>
        <a class="btn lg" href="/">Build a bot ⚡</a>
      </div>
    </section>
  </main>
  <script type="module">
    import { $, api, boardTable, renderShell, wireBoard } from "/js/common.js";
    renderShell("league");
    const board = $("board");
    wireBoard(board);
    async function load(sort) {
      try {
        const { bots, total } = await api(`/api/leaderboard?sort=${sort}&limit=200`);
        board.innerHTML = bots.length ? boardTable(bots) : '<div class="empty">No bots yet. <a href="/">Build the first one →</a></div>';
        $("count").textContent = `${total} bot${total === 1 ? "" : "s"} competing`;
      } catch {
        board.innerHTML = '<div class="empty">Couldn\'t load the league right now.</div>';
      }
    }
    document.querySelector(".tabs").addEventListener("click", (e) => {
      const tab = e.target.closest("[data-sort]");
      if (!tab) return;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t === tab));
      load(tab.dataset.sort);
    });
    load("return");
  </script>
</body>
</html>
