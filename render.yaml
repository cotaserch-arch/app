# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/cotaserch-arch/app
# A persistent disk keeps everyone's profiles, coins and picks across deploys
# (disks need a paid instance; "starter" is the smallest).
services:
  - type: web
    name: clutch
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: clutch-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_FILE
        value: /var/data/db.json
      - key: SPORTS_DATA
        value: auto
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
